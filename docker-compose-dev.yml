services:
  tpv-gateway:
    build: .
    image: tpv-gateway:1.1.0
    restart: always
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
    networks:
      - miw

networks:
  miw:
    external: true

#> docker compose -f docker-compose-dev.yml up --build -d